services:
  bolt:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        BOLT_APP_VERSION: ${BOLT_APP_VERSION:-local}
        BOLT_APP_BRANCH: ${BOLT_APP_BRANCH:-local}
    image: bolt-ai:latest
    ports:
      - '5173:5173'
    env_file:
      # API keys and BOLT_AUTH_* live here; the file is optional
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      PORT: 5173
      HOST: 0.0.0.0
      RUNNING_IN_DOCKER: 'true'
      DEFAULT_NUM_CTX: ${DEFAULT_NUM_CTX:-32768}
      VITE_LOG_LEVEL: ${VITE_LOG_LEVEL:-debug}
    extra_hosts:
      # Lets the container reach a local Ollama or LM Studio on the host
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
